<div id="results" aria-live="polite">
  <!-- Skeleton loader -->
  <div id="skeleton-loader" class="hidden flex flex-col gap-4">
    <div class="skeleton-card bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-2xl p-6">
      <div class="skeleton-header flex items-center gap-4 mb-4">
        <div class="skeleton-avatar w-10 h-10 rounded-xl animate-shimmer"></div>
        <div class="skeleton-title flex-1 h-4 rounded animate-shimmer"></div>
      </div>
      <div class="skeleton-body">
        <div class="h-3 rounded animate-shimmer mb-2"></div>
        <div class="h-3 rounded animate-shimmer w-3/5"></div>
      </div>
    </div>
    <div class="skeleton-card bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-2xl p-6">
      <div class="skeleton-header flex items-center gap-4 mb-4">
        <div class="skeleton-avatar w-10 h-10 rounded-xl animate-shimmer"></div>
        <div class="skeleton-title flex-1 h-4 rounded animate-shimmer"></div>
      </div>
      <div class="skeleton-body">
        <div class="h-3 rounded animate-shimmer mb-2"></div>
        <div class="h-3 rounded animate-shimmer w-3/5"></div>
      </div>
    </div>
    <div class="skeleton-card bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-2xl p-6">
      <div class="skeleton-header flex items-center gap-4 mb-4">
        <div class="skeleton-avatar w-10 h-10 rounded-xl animate-shimmer"></div>
        <div class="skeleton-title flex-1 h-4 rounded animate-shimmer"></div>
      </div>
      <div class="skeleton-body">
        <div class="h-3 rounded animate-shimmer mb-2"></div>
        <div class="h-3 rounded animate-shimmer w-3/5"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div
    id="empty-state"
    class="hidden text-center py-12 px-8 bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-2xl"
  >
    <div class="empty-icon w-20 h-20 mx-auto mb-6 rounded-2xl bg-[var(--bg-elevated)] flex items-center justify-center">
      <svg
        aria-hidden="true"
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="text-[var(--text-muted)]"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
        <line x1="8" y1="8" x2="14" y2="14"></line>
        <line x1="14" y1="8" x2="8" y2="14"></line>
      </svg>
    </div>
    <h3
      class="empty-message text-lg font-semibold text-[var(--text-primary)] mb-2"
      id="no-results-i18n"
      data-i18n="no_results"
    >
      No results found
    </h3>
    <p class="empty-suggestion text-sm text-[var(--text-muted)] max-w-xs mx-auto mb-4" data-i18n="empty_suggestion">
      Try adjusting your search radius or selecting a different fuel type
    </p>
    <div class="empty-actions flex flex-wrap gap-2 justify-center" id="empty-actions"></div>
  </div>

  <!-- Results -->
  <section id="results-section" class="hidden" aria-labelledby="results-heading">
    <h2 id="results-heading" class="sr-only" data-i18n="results_heading">Results</h2>

    <!-- Savings summary header -->
    <p id="summary-header" class="summary-header mt-0 mb-3 text-base font-semibold text-[var(--color-primary)]" aria-live="polite"></p>

    <!-- Trip preference bar: liters / consumption / reference price / sort -->
    <div
      id="trip-pref-bar"
      class="trip-pref-bar mb-4 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-color)] p-4 flex flex-col gap-3"
    >
      <fieldset class="flex flex-wrap items-center gap-2 border-0 m-0 p-0" aria-label="Ordina risultati" data-i18n-aria-label="sort_by">
        <legend class="text-sm font-semibold text-[var(--text-secondary)]" data-i18n="sort_by">Ordina per</legend>
        <button
          type="button"
          class="chip rounded-full px-3 py-1 text-sm border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-primary)] cursor-pointer"
          data-trip-sort="total"
          aria-pressed="true"
          data-i18n="sort_total"
        >Totale</button>
        <button
          type="button"
          class="chip rounded-full px-3 py-1 text-sm border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-primary)] cursor-pointer"
          data-trip-sort="price"
          aria-pressed="false"
          data-i18n="sort_price"
        >Prezzo</button>
        <button
          type="button"
          class="chip rounded-full px-3 py-1 text-sm border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-primary)] cursor-pointer"
          data-trip-sort="distance"
          aria-pressed="false"
          data-i18n="sort_distance"
        >Distanza</button>
      </fieldset>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <label class="block text-sm text-[var(--text-secondary)]" for="trip-liters">
          <span class="block mb-1 font-medium" data-i18n="trip_liters">Litri per pieno</span>
          <input
            type="number"
            id="trip-liters"
            name="trip-liters"
            min="1"
            max="200"
            step="1"
            inputmode="numeric"
            class="w-full rounded-lg border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-primary)] px-3 py-2"
          />
        </label>
        <label class="block text-sm text-[var(--text-secondary)]" for="trip-consumption">
          <span class="block mb-1 font-medium" data-i18n="trip_consumption">Consumo (L/100 km)</span>
          <input
            type="number"
            id="trip-consumption"
            name="trip-consumption"
            min="1"
            max="30"
            step="0.1"
            inputmode="decimal"
            class="w-full rounded-lg border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-primary)] px-3 py-2"
          />
        </label>
        <label class="block text-sm text-[var(--text-secondary)]" for="trip-fuel-price">
          <span class="block mb-1 font-medium" data-i18n="trip_fuel_price">Prezzo riferimento (€/L)</span>
          <input
            type="number"
            id="trip-fuel-price"
            name="trip-fuel-price"
            min="0.5"
            max="5"
            step="0.01"
            inputmode="decimal"
            class="w-full rounded-lg border border-[var(--border-color)] bg-[var(--bg-elevated)] text-[var(--text-primary)] px-3 py-2"
          />
        </label>
      </div>
    </div>
    <div id="stations-list" class="flex flex-col gap-3"></div>
  </section>

  <!-- Error Message -->
  <div
    id="error-message"
    class="error-message hidden flex items-start gap-3 p-4 rounded-xl bg-[var(--color-error-bg)] border border-[var(--color-error-border)] mt-4"
    role="alert"
  >
    <div
      class="error-icon w-8 h-8 rounded-lg bg-[var(--color-error-border)] flex items-center justify-center flex-shrink-0"
    >
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="text-[var(--color-error)]"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <div>
      <p class="text-sm font-medium text-[var(--color-error)]" id="error-text"></p>
    </div>
  </div>
</div>
