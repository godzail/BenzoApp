<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Trova i distributori di benzina vicino a te e confronta i prezzi dei carburanti in Italia. Cerca per città, raggio e tipo di carburante."
    >
    <meta name="theme-color" content="#0d1512" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
    <title>BenzoApp – Trova distributori e confronta i prezzi dei carburanti</title>
    <link rel="icon" href="/favicon.png" type="image/x-icon">
    <!-- Inline theme bootstrap avoids a flash of incorrect theme on first paint. -->
    <script>
    (() => {
      var stored;
      var theme;
      try {
        stored = localStorage.getItem("app-theme");
        theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia?.("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <!-- Custom Design System -->
    <!-- i18next CDN -->
    <script
      defer
      src="https://unpkg.com/i18next@26.3.1/dist/umd/i18next.min.js"
      integrity="sha384-u9Lno28ZWcetjYvw0ZPd9denWYeXoDKRTjmqMr989WT3F2gVOGDSYnOyy5nMqcQr"
      crossorigin="anonymous"
    ></script>
    <!-- App Scripts -->
    <script defer src="/static/js/i18n.js"></script>
    <script defer src="/static/js/app.config.js"></script>
    <script defer src="/static/js/app.storage.js"></script>
    <script defer src="/static/js/app.map.js"></script>
    <script type="module" defer src="/static/js/app.ui.js"></script>
    <script type="module" defer src="/static/js/app.ui.helpers.js"></script>
    <script type="module" defer src="/static/js/app.ui.csv.js"></script>
    <script type="module" defer src="/static/js/app.ui.dom.js"></script>
    <script type="module" defer src="/static/js/app.ui.interactions.js"></script>
    <script defer src="/static/js/app.js"></script>
    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous"
    >
    <!-- Styles (after Leaflet so .leaflet-* overrides win) -->
    <link rel="stylesheet" href="/static/css/styles.split.css">
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
      crossorigin="anonymous"
    ></script>
    <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Instrument Sans", "system-ui", "sans-serif"],
            display: ["Bricolage Grotesque", "Instrument Sans", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "Fira Code", "monospace"],
          },
          borderRadius: {
            sm: "8px",
            md: "12px",
            lg: "16px",
            xl: "24px",
          },
          boxShadow: {
            sm: "var(--shadow-sm)",
            md: "var(--shadow-md)",
            lg: "var(--shadow-lg)",
            xl: "var(--shadow-xl)",
            card: "var(--shadow-card)",
          },
          animation: {
            shimmer: "shimmer 1.5s infinite",
            spin: "spin 1s linear infinite",
            "loading-pulse": "loading-pulse 1.5s ease-in-out infinite",
          },
          keyframes: {
            shimmer: {
              "0%": { backgroundPosition: "200% 0" },
              "100%": { backgroundPosition: "-200% 0" },
            },
            "loading-pulse": {
              "0%, 100%": { opacity: "1" },
              "50%": { opacity: "0.6" },
            },
          },
        },
      },
    };
    </script>
    <!-- Tailwind CSS -->
    <script defer src="https://cdn.tailwindcss.com"></script>
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BenzoApp",
      "description": "Trova i distributori di benzina vicino a te e confronta i prezzi dei carburanti in Italia",
      "applicationCategory": "Utilities",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      }
    }
    </script>
  </head>

  <body
    class="bg-[var(--bg-primary)] text-[var(--text-primary)] min-h-screen font-sans transition-colors duration-[250ms]"
  >
    <!-- Skip links for keyboard navigation -->
    <a href="#main-content" class="skip-link" data-i18n="skip_to_content">Vai al contenuto</a>
    <a href="#search-container" class="skip-link" data-i18n="skip_to_search">Vai alla ricerca</a>

    <!-- Status messages for screen readers -->
    <div aria-live="polite" aria-atomic="true" id="status-messages" class="sr-only"></div>
    <!-- Custom Loading Bar -->
    <div
      id="loading-bar"
      class="loading-bar fixed top-0 left-0 w-full h-0.5 bg-[var(--bg-surface)] z-[10000] opacity-0 transition-opacity duration-150"
      role="progressbar"
      aria-label="Loading"
      aria-hidden="true"
    >
      <div
        class="loading-bar-progress h-full w-0 bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-primary-light)] shadow-[0_0_10px_var(--color-primary)]"
      ></div>
    </div>
    <header
      id="header-container"
      class="sticky top-0 z-[100] p-4 lg:p-6 bg-[var(--glass-bg)] backdrop-blur-[20px] border-b border-[var(--glass-border)]"
    >
      <div class="header-content max-w-[1600px] mx-auto flex items-center justify-between gap-6 flex-wrap"></div>
    </header>
    <main id="main-content" class="max-w-[1600px] mx-auto p-4 lg:p-6">
      <div class="main-layout flex flex-col gap-8 lg:grid lg:grid-cols-[1fr_4px_1fr] lg:gap-0 lg:items-start">
        <!-- Left Column: Search + Results -->
        <div class="search-column flex flex-col" id="search-column">
          <search id="search-container" aria-label="Gas station search"></search>
          <section id="results-container" aria-label="Search results"></section>
        </div>

        <!-- Resizer -->
        <!-- biome-ignore lint/a11y/useSemanticElements: focusable window splitter is the correct ARIA pattern; <hr> cannot be interactive -->
        <div
          class="resizer hidden lg:block w-1 h-[calc(100vh-120px)] cursor-col-resize transition-all duration-150 rounded-full sticky top-[100px] z-10 hover:w-1.5"
          id="layout-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-valuenow="50"
          aria-valuemin="10"
          aria-valuemax="90"
          tabindex="0"
        ></div>

        <!-- Right Column: Map -->
        <div id="map-column" class="lg:sticky lg:top-[100px] lg:h-[calc(100vh-120px)] lg:pl-4">
          <section id="map-container" aria-label="Map view" class="h-full"></section>
        </div>
      </div>
    </main>
    <!-- CSV Update Startup Popup -->
    <div
      id="csv-update-popup"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="csv-popup-title"
      aria-describedby="csv-popup-body"
    >
      <div class="csv-popup-dialog">
        <div class="csv-popup-header">
          <div class="csv-popup-icon" aria-hidden="true">
            <svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <span id="csv-popup-title" class="csv-popup-title" data-i18n="update_csv_popup_title"
            >Data Update Required</span
          >
        </div>
        <p id="csv-popup-body" class="csv-popup-body" data-i18n="update_csv_popup_body">
          Fuel price data is missing or outdated. Click the button below to fetch the latest data.
        </p>
        <div id="csv-popup-status" class="csv-popup-status" aria-live="polite" aria-atomic="true"></div>
        <button id="csv-popup-btn" type="button" class="csv-popup-btn" data-i18n="update_csv_popup_btn">
          Update data
        </button>
      </div>
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.initApp();
    });
    </script>
  </body>
</html>
